name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - name: Checkout mdbase spec tests
        uses: actions/checkout@v5
        with:
          repository: mdbase-dev/mdbase-spec
          ref: 8180449530b5db54cde88383c3b96798596cc4b4
          path: mdbase-spec
      - run: npm run build
      - run: npm test
        env:
          MDBASE_SPEC_REPO_DIR: ${{ github.workspace }}/mdbase-spec
          MDBASE_REQUIRE_V03_CONFORMANCE: "1"
      - name: Verify installable package
        run: npm run test:package
