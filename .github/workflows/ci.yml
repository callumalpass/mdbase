name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Checkout mdbase spec tests
        run: git clone --depth 1 https://github.com/callumalpass/mdbase-spec.git mdbase-spec
      - run: npm run build
      - run: npm test
        env:
          MDBASE_SPEC_TESTS_DIR: ${{ github.workspace }}/mdbase-spec/tests
          MDBASE_REQUIRE_CONFORMANCE: "1"
