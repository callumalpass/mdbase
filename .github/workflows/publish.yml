name: Publish to npm

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - run: npm ci
      - run: npm run build
      - name: Publish package
        run: npm publish --access public --tag "$NPM_DIST_TAG"
        env:
          NPM_DIST_TAG: ${{ github.event_name == 'workflow_dispatch' && 'next' || (github.event.release.prerelease && 'next' || 'latest') }}
